name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # 또는 main (본인의 기본 브랜치 이름)

# GitHub Pages 배포를 위한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 만약 Next.js 빌드 등 사전 빌드 단계가 필요하다면 여기에 node 설정 및 npm run build 단계를 추가해야 합니다.
      # 이미 /out 폴더가 저장소에 push되는 구조라면 아래 단계만으로 충분합니다.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 핵심: 배포할 폴더를 /out 으로 지정합니다.
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
