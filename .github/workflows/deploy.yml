name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # 또는 main (사용 중인 기본 브랜치 이름)

# 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 만약 빌드 과정(npm run build 등)이 필요하다면 여기에 노드 설정 및 빌드 단계를 추가하세요.
      # 이미 /out 폴더가 저장소에 커밋되어 올라가는 구조라면 아래 'Upload artifact' 단계로 바로 진행됩니다.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⭐️ 이 부분에 배포하고 싶은 폴더인 out을 지정합니다.
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
